<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sign in to Netflix</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #141414;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    background: #1f1f1f;
    border-radius: 12px;
    padding: 32px 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    text-align: center;
  }
  .logo { font-size: 48px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin-bottom: 8px; color: #e50914; }
  .subtitle { color: #aaa; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }

  .info {
    padding: 14px;
    background: #2a2a2a;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 14px;
    color: #ccc;
  }
  .info b { color: #fff; }

  .btn {
    display: block;
    width: 100%;
    padding: 16px 20px;
    margin: 10px 0;
    background: #e50914;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
  }
  .btn:hover { background: #f40612; }

  .help {
    margin-top: 20px;
    font-size: 12px;
    color: #888;
    line-height: 1.6;
  }
  .help a { color: #4fc3f7; text-decoration: none; }
  .help a:hover { text-decoration: underline; }

  .error { color: #ff5252; }
  .success { color: #4caf50; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🎬</div>
    <h1>Sign in to Netflix</h1>
    <p class="subtitle">Tap the button below to open Netflix and sign in automatically.</p>

    <div class="info">
      👆 <b>Open the Netflix app</b> to continue.
    </div>

    <a id="btn-app" class="btn" href="#">
      📱 Open Netflix App
    </a>

    <div class="help">
      <p>This link is safe and can only be used once.</p>
      <p style="margin-top:6px;">Expires in <span id="expiry-text">59 minutes</span>.</p>
    </div>
  </div>

<script>
(function() {
  const NFTOKEN = {{ nftoken|tojson }};
  const NETFLIX_HTTPS = "https://www.netflix.com/?nftoken=" + NFTOKEN;
  const EXPIRY_MIN = {{ expiry_min|tojson }};
  const ANDROID_PKG = "com.netflix.mediaclient";

  const FALLBACK_ENCODED = encodeURIComponent(NETFLIX_HTTPS);
  const INTENT_URL = "intent://www.netflix.com/?nftoken=" + NFTOKEN +
    "#Intent;scheme=https;package=" + ANDROID_PKG +
    ";S.browser_fallback_url=" + FALLBACK_ENCODED +
    ";end";

  const userAgent = navigator.userAgent || "";
  const isAndroid = /Android/i.test(userAgent);

  const btnApp = document.getElementById("btn-app");
  const expiryText = document.getElementById("expiry-text");

  if (expiryText) expiryText.textContent = EXPIRY_MIN + " minutes";

  // No auto-redirect on any platform.
  // User must tap the button. Chrome only fires intent:// on user gesture.

  if (isAndroid) {
    // Android: open the Netflix app via intent://
    btnApp.href = INTENT_URL;
  } else {
    // iOS / PC / Web: HTTPS Universal Link (Safari will offer to open Netflix app)
    btnApp.href = NETFLIX_HTTPS;
  }
})();
</script>
</body>
</html>
