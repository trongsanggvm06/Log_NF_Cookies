<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#1b1b1f" />
  <title>Mở Netflix</title>
  <!--
    ANDROID: link `https://www.netflix.com/unsupported?nftoken=...` được Netflix
    App Link claim → click → mở app Netflix → app tự redeem token → vào /browse.
    iOS/PC: dùng link web `?nftoken=...` thuần (AASA exclude path "/unsupported" trên iOS).
  -->
  <style>
    :root { --accent:#e50914; --bg:#0b0b0f; --text:#f2f2f2; --muted:#9a9aa2; --ok:#4ade80; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; height:100%; }
    body {
      background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      display:flex; align-items:center; justify-content:center; padding:24px; text-align:center;
      min-height:100vh; min-height:100dvh;
    }
    .box { max-width:420px; width:100%; }
    .logo { width:72px; height:72px; margin:0 auto 20px; background:var(--accent); border-radius:16px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:28px; letter-spacing:-1px; }
    h1 { font-size:22px; margin:0 0 8px; font-weight:700; }
    p { color:var(--muted); font-size:14px; line-height:1.5; margin:0 0 24px; }
    .btn-open {
      display:flex; align-items:center; justify-content:center; gap:10px;
      width:100%; padding:18px 24px; border:0; border-radius:14px;
      background:var(--accent); color:#fff; font-size:19px; font-weight:800;
      text-decoration:none; cursor:pointer; margin:0 0 12px;
      box-shadow:0 6px 20px rgba(229,9,20,.35);
      transition:transform .1s, box-shadow .1s;
      -webkit-user-select:none; user-select:none;
    }
    .btn-open:active { transform:scale(.97); box-shadow:0 3px 10px rgba(229,9,20,.3); }
    .info {
      background:#1a1a22; border:1px solid #2a2a35; border-radius:10px;
      padding:12px 14px; font-size:12.5px; line-height:1.55; color:var(--muted);
      text-align:left;
    }
    .info b { color:#fff; }
    .badge {
      display:inline-block; background:#262630; color:var(--muted);
      padding:3px 10px; border-radius:99px; font-size:11px; font-weight:600;
      margin-bottom:14px; letter-spacing:.5px; text-transform:uppercase;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">N</div>
    <span class="badge" id="badge">Sẵn sàng mở Netflix</span>
    <h1>Mở Netflix</h1>
    <p id="desc">Bấm nút bên dưới — Netflix sẽ tự mở và đăng nhập vào tài khoản của bạn.</p>

    <!-- 1 nút duy nhất: dùng app_url (/unsupported?nftoken=...) trên Android,
         web_url (?nftoken=...) trên iOS/PC. -->
    <a class="btn-open" id="open-btn" href="{{ open_url | safe }}" rel="noopener">
      <span>▶ MỞ NETFLIX</span>
    </a>

    <div class="info" id="info" style="display:none;"></div>
  </div>

  <script>
    var OPEN_URL = {{ open_url | tojson }};
    var ua = navigator.userAgent || "";
    var isAndroid = /Android/i.test(ua);
    var infoBox = document.getElementById("info");
    var badge = document.getElementById("badge");

    if (isAndroid) {
      infoBox.style.display = "block";
      infoBox.innerHTML =
        "<b>Trên Android:</b> bấm <b>MỞ NETFLIX</b> → app Netflix sẽ tự mở và đăng nhập. " +
        "Nếu Chrome hiện popup <b>\"Open with\"</b> → chọn <b>Netflix</b>.";
      badge.textContent = "📱 Android";
    } else if (/iPhone|iPad|iPod/i.test(ua)) {
      badge.textContent = "📱 iPhone / iPad";
    } else {
      badge.textContent = "🖥️ Desktop";
    }
  </script>
</body>
</html>
