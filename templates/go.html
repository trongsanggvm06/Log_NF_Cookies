<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#1b1b1f" />
  <title>Đang mở Netflix…</title>
  <style>
    :root { --accent:#e50914; --bg:#0b0b0f; --text:#f2f2f2; --muted:#9a9aa2; --ok:#4ade80; --warn:#fbbf24; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; height:100%; }
    body {
      background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      display:flex; align-items:center; justify-content:center; padding:24px; text-align:center;
      min-height:100vh; min-height:100dvh;
    }
    .box { max-width:420px; width:100%; }
    .logo { width:64px; height:64px; margin:0 auto 18px; background:var(--accent); border-radius:14px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:24px; letter-spacing:-1px; }
    h1 { font-size:21px; margin:0 0 10px; font-weight:700; }
    p { color:var(--muted); font-size:14px; line-height:1.6; margin:0 0 22px; }
    .spinner {
      width:48px; height:48px; margin:0 auto 22px; border-radius:50%;
      border:4px solid rgba(255,255,255,.12); border-top-color:var(--accent);
      animation:spin .9s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    .btn {
      display:flex; align-items:center; justify-content:center; gap:8px;
      width:100%; padding:16px 20px; border:0; border-radius:12px;
      background:var(--accent); color:#fff; font-size:17px; font-weight:700;
      text-decoration:none; cursor:pointer; margin:0 0 10px;
      transition:transform .1s, opacity .1s;
      -webkit-user-select:none; user-select:none;
    }
    .btn:active { transform:scale(.98); opacity:.9; }
    .btn-secondary { background:#262630; color:#fff; }
    .btn-success { background:var(--ok); color:#000; }

    .status {
      display:none; border-radius:10px; padding:12px 14px;
      font-size:13.5px; line-height:1.5; margin:0 0 18px; text-align:left;
    }
    .status.ok { display:block; background:#0e2a1a; border:1px solid #2a5a3a; color:var(--ok); }
    .status.warn { display:block; background:#2a2515; border:1px solid #5a4d20; color:var(--warn); }
    .status b { color:#fff; }
    .hint { font-size:12.5px; color:var(--muted); margin-top:18px; line-height:1.5; }

    .badge {
      display:inline-block; background:#262630; color:var(--muted);
      padding:3px 10px; border-radius:99px; font-size:11px; font-weight:600;
      margin-bottom:14px; letter-spacing:.5px; text-transform:uppercase;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">N</div>
    <span class="badge" id="badge">Đang chuẩn bị…</span>
    <h1 id="title">Mở Netflix</h1>
    <p id="desc">Nhấn nút bên dưới để mở Netflix đã đăng nhập sẵn tài khoản của bạn.</p>

    <div id="status-box" class="status"></div>

    <a class="btn" id="primary-btn" href="#" rel="noopener" style="display:none;">
      <span id="primary-text">Mở Netflix</span>
    </a>
    <a class="btn btn-secondary" id="secondary-btn" href="#" rel="noopener" style="display:none;">
      <span id="secondary-text">Mở bằng trình duyệt</span>
    </a>

    <div class="hint" id="hint">
      Trên iPhone/iPad có thể trình duyệt hỏi <b>"Open in App?"</b> — bấm <b>Open</b> để mở app Netflix đã login sẵn.
    </div>
  </div>

  <script>
    // Token được server inject an toàn.
    var TOKEN = {{ token | tojson }};
    var HOST = {{ host | tojson }};
    // URL Universal Link: AASA của netflix.com cho phép pattern /?* (path / + query)
    // mà KHÔNG nằm trong exclude list → iOS sẽ mở app Netflix qua Universal Link.
    // Tuy nhiên app Netflix iOS KHÔNG redeem ?nftoken= ở deep link (chỉ web redeem)
    // nên app mở nhưng không login. Vì vậy flow thực tế phải dùng SAFARI trước để
    // Netflix web redeem token + set cookie trên netflix.com, sau đó mở app.
    // App Netflix sẽ dùng ASWebAuthenticationSession / iCloud Keychain nếu user
    // đã từng login app với cùng Apple ID.
    var NF_TOKEN_URL = "https://www.netflix.com/?nftoken=" + encodeURIComponent(TOKEN);
    // Fallback cho browser không có app Netflix hoặc user muốn web.
    var NF_WEB_URL = "https://www.netflix.com/browse";
    // Custom URL scheme của Netflix (DEPRECATED từ 2024+ trên iOS mới nhưng vẫn thử).
    // Format: nflx://www.netflix.com/browse — sẽ mở app Netflix trực tiếp nếu device còn support.
    var NF_CUSTOM_URL = "nflx://www.netflix.com/browse";
    // Safari path: mở trang web Netflix trong Safari (KHÔNG phải app) để Netflix web
    // redeem ?nftoken= → set cookie trên domain netflix.com trong Safari. Sau đó
    // user mở app Netflix → app có thể dùng session từ Safari (qua iCloud Keychain)
    // nếu cùng Apple ID và cùng Netflix account. Đây là flow Netflix support.
    var NF_SAFARI_URL = NF_TOKEN_URL;

    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    var isAndroid = /Android/i.test(ua);
    var isMobile = isIOS || isAndroid;
    var isLocal = /^(127\.|localhost|0\.0\.0\.0|192\.168\.|10\.|172\.(1[6-9]|2[0-9]|3[0-1])\.)/i.test(HOST);

    var badge = document.getElementById("badge");
    var titleEl = document.getElementById("title");
    var descEl = document.getElementById("desc");
    var statusBox = document.getElementById("status-box");
    var primaryBtn = document.getElementById("primary-btn");
    var secondaryBtn = document.getElementById("secondary-btn");
    var primaryText = document.getElementById("primary-text");
    var secondaryText = document.getElementById("secondary-text");
    var hintEl = document.getElementById("hint");

    // ─── Local host: dừng sớm ─────────────────────────────────────────────
    if (isLocal) {
      badge.textContent = "⚠️ Local";
      titleEl.textContent = "Không truy cập từ xa";
      descEl.innerHTML = "Link này dùng địa chỉ <b>local</b> (" + HOST + ") — chỉ mở được trên <b>chính thiết bị chạy server</b>. Dùng URL public (vd <code>https://&lt;your-app&gt;.onrender.com</code>) thay thế.";
      primaryBtn.style.display = "none";
      secondaryBtn.style.display = "none";
      hintEl.style.display = "none";
    }
    // ─── Mobile (iOS/Android): thử 3 path để tìm cái work ──────────────
    // 1) Universal Link /?nftoken= → mở app (đã test: app mở nhưng KHÔNG redeem)
    // 2) Custom URL scheme nflx:// → mở app qua scheme (deprecated, có thể fail)
    // 3) Safari path: mở web trong Safari để set cookie, sau đó user mở app
    else if (isMobile) {
      badge.textContent = isIOS ? "📱 iPhone / iPad" : "📱 Android";
      titleEl.textContent = "Mở Netflix";
      descEl.textContent = "Bấm nút bên dưới để mở app Netflix đã đăng nhập sẵn.";

      // Status box giải thích flow 3 bước cho user
      statusBox.className = "status warn";
      statusBox.innerHTML = "⚠️ <b>Lưu ý quan trọng (iOS/Android):</b><br>"
        + "1️⃣ Bấm <b>Mở web trên Safari</b> trước → Netflix web tự đăng nhập.<br>"
        + "2️⃣ <b>KHÔNG đóng Safari</b> — giữ tab Netflix đang login.<br>"
        + "3️⃣ Bấm <b>Mở app Netflix</b> → app sẽ tự đăng nhập bằng session từ Safari (qua iCloud Keychain).<br><br>"
        + "Nếu app vẫn yêu cầu login: đăng nhập 1 lần trong app với cùng account, lần sau sẽ tự động.";

      // Nút chính: mở app Netflix qua Universal Link
      primaryBtn.href = NF_TOKEN_URL;
      primaryText.textContent = isIOS ? "📱 Mở app Netflix" : "📱 Mở app Netflix";
      primaryBtn.className = "btn";
      primaryBtn.style.display = "flex";

      // Nút phụ: mở web trong Safari (set cookie trước)
      // Dùng /go-redirect để server redeem NFToken + redirect sang netflix.com/browse.
      // Safari sẽ thấy netflix.com với session cookie → login web Netflix.
      // Sau đó user mở app Netflix → app dùng iCloud Keychain / ASWebAuthenticationSession
      // để reuse session → auto login.
      var scheme = "http";
      try {
        scheme = (location.protocol || "https:").replace(":", "");
      } catch (e) {}
      var serverOrigin = scheme + "://" + HOST;
      secondaryBtn.href = serverOrigin + "/go-redirect?t=" + encodeURIComponent(TOKEN);
      secondaryText.textContent = "🌐 Mở web trên Safari";
      secondaryBtn.className = "btn btn-secondary";
      secondaryBtn.style.display = "flex";

      // Nút thứ 3: thử nflx:// custom scheme (deprecated, có thể không work)
      // Hiển thị dưới dạng link nhỏ cho user test thử
      var extraHtml = '<div style="margin-top:18px;font-size:12px;color:var(--muted);">'
        + 'Thử nghiệm: <a href="' + NF_CUSTOM_URL + '" style="color:var(--accent);text-decoration:underline;">nflx:// mở app (cũ)</a>'
        + ' · <a href="' + NF_WEB_URL + '" style="color:var(--muted);text-decoration:underline;">/browse (không token)</a>'
        + '</div>';
      hintEl.innerHTML = extraHtml;
    }
    // ─── Desktop: mở thẳng web Netflix (Netflix web parse ?nftoken= → login) ─
    else {
      badge.textContent = "🖥️ Desktop";
      titleEl.textContent = "Mở Netflix";
      descEl.textContent = "Bấm nút bên dưới để mở Netflix đã đăng nhập sẵn trên trình duyệt.";
      statusBox.className = "status ok";
      statusBox.innerHTML = "✅ Sẵn sàng! Netflix sẽ tự đăng nhập — không cần nhập email/mật khẩu.";

      primaryBtn.href = NF_TOKEN_URL;
      primaryText.textContent = "🎬 Mở Netflix";
      primaryBtn.className = "btn btn-success";
      primaryBtn.style.display = "flex";

      secondaryBtn.style.display = "none";
    }
  </script>
</body>
</html>
