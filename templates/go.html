<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#1b1b1f" />
  <title>Mở Netflix</title>
  <style>
    :root { --accent:#e50914; --bg:#0b0b0f; --text:#f2f2f2; --muted:#9a9aa2; --ok:#4ade80; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; height:100%; }
    body {
      background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      display:flex; align-items:center; justify-content:center; padding:24px; text-align:center;
      min-height:100vh; min-height:100dvh;
    }
    .box { max-width:420px; width:100%; }
    .logo { width:72px; height:72px; margin:0 auto 20px; background:var(--accent); border-radius:16px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:28px; letter-spacing:-1px; }
    h1 { font-size:22px; margin:0 0 8px; font-weight:700; }
    p { color:var(--muted); font-size:14px; line-height:1.5; margin:0 0 24px; }

    .btn-open {
      display:flex; align-items:center; justify-content:center; gap:10px;
      width:100%; padding:18px 24px; border:0; border-radius:14px;
      background:var(--accent); color:#fff; font-size:19px; font-weight:800;
      text-decoration:none; cursor:pointer; margin:0 0 16px;
      box-shadow:0 6px 20px rgba(229,9,20,.35);
      transition:transform .1s, box-shadow .1s;
      -webkit-user-select:none; user-select:none;
    }
    .btn-open:active { transform:scale(.97); box-shadow:0 3px 10px rgba(229,9,20,.3); }

    .info {
      background:#1a1a22; border:1px solid #2a2a35; border-radius:10px;
      padding:12px 14px; font-size:12.5px; line-height:1.55; color:var(--muted);
      text-align:left;
    }
    .info b { color:#fff; }
    .badge {
      display:inline-block; background:#262630; color:var(--muted);
      padding:3px 10px; border-radius:99px; font-size:11px; font-weight:600;
      margin-bottom:14px; letter-spacing:.5px; text-transform:uppercase;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">N</div>
    <span class="badge" id="badge">Đang tải…</span>
    <h1>Mở Netflix</h1>
    <p id="desc">Bấm nút bên dưới để mở Netflix đã đăng nhập sẵn.</p>

    <!--
      href đã set bởi Jinja2 server-side với token URL-encode đúng 1 lần.
      URL gốc netflix.com/?nftoken=<token>:
        - iOS AASA: match /?* (root + query) → mở app Netflix qua Universal Link.
          iOS show "Open in App?" → user bấm Open → app Netflix redeem token
          từ URL → set session trong app → auto login.
        - Android App Link: match mọi URL trên netflix.com → mở app Netflix.
          App redeem token thành công.
        - Nếu không có app: mở Safari/Chrome → Netflix web redeem + set cookie.
    -->
    <a class="btn-open" id="open-btn" href="https://www.netflix.com/?nftoken={{ token | urlencode }}" rel="noopener">
      <span id="open-text">▶ OPEN HERE</span>
    </a>

    <div class="info" id="info" style="display:none;"></div>
  </div>

  <script>
    // Token RAW đã được server decode (1-2 lần) và sẽ được urlencode 1 lần
    // trong href của nút bên dưới. KHÔNG cần JS set href - đã có sẵn.
    var HOST = {{ host | tojson }};
    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    var isAndroid = /Android/i.test(ua);
    var isMobile = isIOS || isAndroid;
    var isLocal = /^(127\.|localhost|0\.0\.0\.0|192\.168\.|10\.|172\.(1[6-9]|2[0-9]|3[0-1])\.)/i.test(HOST);

    var badge = document.getElementById("badge");
    var descEl = document.getElementById("desc");
    var openText = document.getElementById("open-text");
    var infoBox = document.getElementById("info");

    if (isLocal) {
      badge.textContent = "⚠️ LOCAL";
      descEl.innerHTML = "Link này dùng địa chỉ <b>local</b> (" + HOST + ") — chỉ mở được trên <b>chính thiết bị chạy server</b>.";
      document.getElementById("open-btn").style.display = "none";
      infoBox.style.display = "none";
    } else if (isMobile) {
      badge.textContent = isIOS ? "📱 iPhone / iPad" : "📱 Android";
      descEl.textContent = "Bấm nút bên dưới để mở Netflix đã đăng nhập sẵn.";
      openText.textContent = "▶ OPEN HERE";
      if (isIOS) {
        infoBox.style.display = "block";
        infoBox.innerHTML =
          "<b>Trên iPhone:</b> Bấm <b>\"OPEN HERE\"</b> → iOS sẽ hỏi <b>\"Open in App?\"</b> → bấm <b>Open</b> để mở app Netflix.";
      } else {
        infoBox.style.display = "block";
        infoBox.innerHTML =
          "<b>Trên Android:</b> Bấm <b>\"OPEN HERE\"</b> → app Netflix sẽ mở và tự đăng nhập.";
      }
    } else {
      // Desktop: mở thẳng web Netflix (Netflix web parse ?nftoken= → login)
      badge.textContent = "🖥️ Desktop";
      descEl.textContent = "Bấm nút bên dưới để mở Netflix đã đăng nhập sẵn trên trình duyệt.";
      openText.textContent = "▶ OPEN HERE";
      infoBox.style.display = "none";
    }
  </script>
</body>
</html>
